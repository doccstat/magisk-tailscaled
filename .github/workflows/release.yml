name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact module.prop version (existing releases are never replaced)'
        type: string
        required: true
      update_feed_url:
        description: 'Reviewed stable HTTPS feed URL; empty keeps automatic updates disabled'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: module-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'doccstat/magisk-tailscaled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Validate explicit version and run tests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 -c 'import os; from tools.build import metadata; assert os.environ["VERSION"] == metadata()["version"]'
          export GOTMPDIR="$HOME/.cache/t" TMPDIR="$HOME/.cache/t"
          mkdir -p "$TMPDIR"
          go test -race ./cmd/tsctl
          go vet ./cmd/tsctl
          node --test tests/*.test.js
          python3 -B -m unittest discover -s tests -v
      - name: Build source-pinned full and lightweight ZIPs
        env:
          VERSION: ${{ inputs.version }}
          UPDATE_FEED_URL: ${{ inputs.update_feed_url }}
          BUILD_DIR: ${{ runner.temp }}/build
          DIST_DIR: ${{ runner.temp }}/dist
        run: |
          args=(--arch all --format both --payload-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION")
          if [[ -n "$UPDATE_FEED_URL" ]]; then
            args+=(--update-url "$UPDATE_FEED_URL")
          fi
          ./.github/tools/build.sh "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-payload
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload
          path: ${{ runner.temp }}/dist
      - name: Publish a new prerelease without changing existing releases or branches
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          DIST_DIR: ${{ runner.temp }}/dist
        run: python3 -B tools/release.py
