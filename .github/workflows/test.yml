name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Test download and packaging safeguards
        run: python3 -B -m unittest discover -s tests -v
      - name: Build both ZIPs from pinned release assets
        env:
          BUILD_DIR: ${{ runner.temp }}/magisk-tailscaled/build
          DIST_DIR: ${{ runner.temp }}/magisk-tailscaled/dist
        run: ./.github/tools/build.sh
